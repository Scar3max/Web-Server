# =============================================================================
# Production Nginx Reverse Proxy Configuration for Racing Server
# =============================================================================

# Map WebSocket Upgrade header to connection directive per RFC 6455
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream racing_backend {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost racing.local;

    # Client body limit matching server MAX_BODY_SIZE (10 MB)
    client_max_body_size 10M;

    # Gzip compression for static HTTP content
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # HTTP Static & API Endpoints
    location / {
        proxy_pass http://racing_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keepalive upstream connections
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Dedicated WebSocket Endpoint (/ws)
    location /ws {
        proxy_pass http://racing_backend;
        proxy_http_version 1.1;

        # RFC 6455 Hop-by-Hop Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for low-latency authoritative frame delivery
        proxy_buffering off;

        # Extended timeouts for long-lived multiplayer racing sessions
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Lightweight Health Check
    location /health {
        proxy_pass http://racing_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Metrics endpoint restricted or open for Prometheus scraping
    location /metrics {
        proxy_pass http://racing_backend/metrics;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
